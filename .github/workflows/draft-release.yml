name: Build signed draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Preview tag (for example v0.1.0-preview.1)
        required: true
        type: string
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Check preview tag and signing configuration
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CSQTT_SIGNING_KEY: ${{ secrets.CSQTT_SIGNING_KEY }}
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+', os.environ['RELEASE_TAG']), 'Use a preview tag'
          assert os.environ.get('CSQTT_SIGNING_KEY'), 'Configure the repository signing secret first'
          PY
  build:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: openwrt-25.12.5-aarch64-cortex-a53
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: android-helper-debug
          path: dist/android
      - name: Verify signed artifacts
        run: |
          openssl dgst -sha256 -verify release/csqtt-public.pem -signature dist/manifest.sig dist/manifest.json
          python3 scripts/verify-release.py dist
      - name: Create a draft preview
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --prerelease \
            --title "CSQTT OpenWrt $RELEASE_TAG" --notes-file docs/PREVIEW_NOTES.md \
            dist/*.apk dist/manifest.json dist/manifest.sig dist/SHA256SUMS dist/android/*.apk
