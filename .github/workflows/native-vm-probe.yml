name: Diagnostic official transport only (never release evidence)
on:
  push:
    branches: [codex/portable-preview.10-vm-probe]
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Compare bounded verified official downloads without building binaries
        run: |
          python3 - <<'PY'
          import hashlib,pathlib,subprocess,tempfile,urllib.request,urllib.error
          pins={'24.10.8':'6c94190246a54088e3984fc0c4cbbb518972abb2b10a28e30a0c41554eea8b9d','25.12.6':'55e52bb34de582a1ebe56bd50f94ff54ac7c77f5bca9cae807656d1930456da4'}
          limit=67108864
          for version,digest in pins.items():
              url='https://downloads.openwrt.org/releases/'+version+'/targets/x86/64/openwrt-'+version+'-x86-64-rootfs.tar.gz'
              for label,headers in [('urllib_default',{}),('urllib_explicit',{'User-Agent':'CSQTT-build-verifier/1'})]:
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=25) as response:
                          data=response.read(limit+1)
                          origin=response.url.startswith('https://downloads.openwrt.org/')
                      verified=origin and 0<len(data)<=limit and hashlib.sha256(data).hexdigest()==digest
                      print(version,label,'verified='+str(verified),flush=True)
                  except urllib.error.HTTPError as error: print(version,label,'http_status='+str(error.code),flush=True)
                  except Exception as error: print(version,label,'exception='+type(error).__name__,flush=True)
              with tempfile.TemporaryDirectory() as temporary:
                  target=pathlib.Path(temporary)/'rootfs.tar.gz'
                  result=subprocess.run(['curl','--fail','--location','--proto','=https','--proto-redir','=https','--max-time','30','--max-filesize',str(limit),'--output',str(target),'--write-out','%{url_effective}',url],capture_output=True,text=True,timeout=35)
                  verified=result.returncode==0 and result.stdout.startswith('https://downloads.openwrt.org/') and target.is_file() and 0<target.stat().st_size<=limit and hashlib.sha256(target.read_bytes()).hexdigest()==digest
                  print(version,'curl','exit='+str(result.returncode),'verified='+str(verified),flush=True)
          PY
