name: Diagnostic existing candidate VM (not release evidence)
on:
  push:
    branches: [codex/portable-preview.10-vm-probe]
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: '24.10.8'
            artifact_run: 39839530729
          - release: '25.12.6'
            artifact_run: 39946222767
    steps:
      - uses: actions/checkout@v4
      - name: Disposable VM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 openssh-client python3-pexpect e2fsprogs busybox-static
      - name: Validate bounded image preparation on Linux
        run: |
          python3 tests/platforms/platforms_test.py
          python3 tests/release/openwrt_image_test.py
          python3 tests/release/vm_disk_test.py
          python3 tests/release/vm_acceptance_test.py
          python3 tests/release/public_command_test.py
      - uses: actions/download-artifact@v4
        with:
          name: candidate-official-${{ matrix.release }}-x86-64-x86_64
          run-id: ${{ matrix.artifact_run }}
          github-token: ${{ github.token }}
          path: .work/diagnostic-vm
      - name: Private fixture only, never publish or qualify these packages
        env:
          CSQTT_SIGNING_KEY: ${{ secrets.CSQTT_SIGNING_KEY || secrets.secret1 }}
        run: python3 scripts/sign-portable-release.py .work/diagnostic-vm --provisional
      - name: Diagnose actual pinned image preparation and guest installation
        env:
          CSQTT_SIGNING_KEY: ${{ secrets.CSQTT_SIGNING_KEY || secrets.secret1 }}
        run: python3 scripts/test-openwrt-vm.py --directory .work/diagnostic-vm --profile official-${{ matrix.release }}-x86-64-x86_64
