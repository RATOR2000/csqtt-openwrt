name: Diagnostic conforming LuCI HTML login and native policies (never release evidence)
on:
  push:
    branches: [codex/portable-preview.10-vm-probe]
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        release: ['24.10.8', '25.12.6']
    steps:
      - uses: actions/checkout@v4
      - name: Disposable SDK host tools and VM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gawk file gettext libncurses-dev libssl-dev python3 python3-pexpect rsync swig unzip wget zlib1g-dev zstd qemu-user qemu-system-x86 openssh-client e2fsprogs busybox-static
      - name: Native deadline and private diagnostic host boundaries
        run: |
          python3 tests/release/vm_timeout_test.py
          python3 tests/release/vm_acceptance_test.py
      - uses: actions/download-artifact@v4
        with:
          name: candidate-official-${{ matrix.release }}-x86-64-x86_64
          run-id: 39996605422
          github-token: ${{ github.token }}
          path: .work/diagnostic-vm
      - name: Authenticate exact official feed closure without rebuilding client
        env:
          PROFILE_ID: official-${{ matrix.release }}-x86-64-x86_64
        run: |
          set -euo pipefail
          python3 tests/release/dependency_test.py
          ROOT="$PWD"
          eval "$(python3 scripts/platforms.py --profile "$PROFILE_ID" --format shell)"
          mkdir -p .work/diagnostic-sdk
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 "$SDK_URL" -o .work/diagnostic-sdk/sdk.tar.zst
          printf '%s  %s\n' "$SDK_SHA" .work/diagnostic-sdk/sdk.tar.zst | sha256sum -c -
          tar --zstd -xf .work/diagnostic-sdk/sdk.tar.zst -C .work/diagnostic-sdk
          SDK="$ROOT/.work/diagnostic-sdk/$SDK_NAME"
          make -C "$SDK" defconfig > .work/diagnostic-sdk/config.log 2>&1
          USIGN="$SDK/staging_dir/host/bin/usign"
          if [ "$PACKAGE_FORMAT" = ipk ] && [ ! -x "$USIGN" ]; then
            if ! make -C "$SDK" tools/usign/compile -j2 V=s > .work/diagnostic-sdk/usign.log 2>&1; then
              tail -n 60 .work/diagnostic-sdk/usign.log
              exit 1
            fi
          fi
          python3 scripts/bundle-dependencies.py --profile "$PROFILE_ID" --directory .work/diagnostic-vm --apk "$SDK/staging_dir/host/bin/apk" --usign "$USIGN"
          python3 scripts/release-manifest.py .work/diagnostic-vm --profile "$PROFILE_ID" --registry platforms/registry.json --dependencies .work/diagnostic-vm/dependencies.json --third-party .work/diagnostic-vm/dnsmasq-source.json
      - name: Private diagnostic fixture only; mismatched binaries never qualify
        env:
          CSQTT_SIGNING_KEY: ${{ secrets.CSQTT_SIGNING_KEY || secrets.secret1 }}
        run: python3 scripts/sign-portable-release.py .work/diagnostic-vm --provisional
      - name: Diagnose native install and rollback with complete module cache
        env:
          CSQTT_SIGNING_KEY: ${{ secrets.CSQTT_SIGNING_KEY || secrets.secret1 }}
        run: python3 scripts/test-openwrt-vm.py --directory .work/diagnostic-vm --profile official-${{ matrix.release }}-x86-64-x86_64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-feed-vm-${{ matrix.release }}
          path: .work/diagnostic-vm/*-vm-evidence.json
          if-no-files-found: warn
