name: Validate and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    concurrency:
      group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}-checks
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - name: Policy and LuCI tests
        run: node --test tests/policy/*.test.* tests/luci/*.test.*
      - name: CAPTCHA broker
        working-directory: captcha-broker
        run: |
          go test -race ./...
          go vet ./...
      - name: Installer failure and rollback scenarios
        run: python3 tests/installer/installer_test.py
      - name: Release artifact integrity
        run: python3 tests/release/release_test.py
      - name: Shell syntax
        run: |
          bash -n scripts/build-sdk.sh
          sh -n install.sh
          find openwrt -type f \( -name '*.init' -o -name manage -o -name tun-hook -o -name '9*-csqtt*' \) -exec sh -n {} \;
  core:
    concurrency:
      group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}-core
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vendor/csqtt/rust-client/target
          key: cargo-host-${{ runner.os }}-1.97.1-${{ hashFiles('vendor/csqtt/rust-client/Cargo.lock') }}
      - name: Rust and native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang ninja-build pkg-config
          rustup toolchain install 1.97.1 --profile minimal
      - name: Rust tests
        env:
          RUST_BACKTRACE: '1'
        run: |
          cargo +1.97.1 test --locked --manifest-path vendor/csqtt/rust-client/Cargo.toml turn::integration_tests::authenticated_flow_survives_pool_deficit_and_keeps_channel_data_zero_copy -- --exact
          cargo +1.97.1 test --locked --manifest-path vendor/csqtt/rust-client/Cargo.toml
      - uses: actions/cache/save@v4
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vendor/csqtt/rust-client/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
  native-policy:
    concurrency:
      group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}-native-policy
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Native policy test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libjson-c-dev libnftables-dev pkg-config nftables iproute2
          git init .work/ucode
          git -C .work/ucode remote add origin https://github.com/jow-/ucode.git
          git -C .work/ucode fetch --depth=1 origin 85922056ef7abeace3cca3ab28bc1ac2d88e31b1
          git -C .work/ucode checkout --detach FETCH_HEAD
          cmake -S .work/ucode -B .work/ucode/build -DFS_SUPPORT=ON -DUBUS_SUPPORT=OFF -DUCI_SUPPORT=OFF -DULOOP_SUPPORT=OFF -DNL80211_SUPPORT=OFF -DRTNL_SUPPORT=OFF -DRESOLV_SUPPORT=OFF -DZLIB_SUPPORT=OFF -DDIGEST_SUPPORT=OFF -DLOG_SUPPORT=OFF
          cmake --build .work/ucode/build -j2
          curl --fail --location --retry 3 https://thekelleys.org.uk/dnsmasq/dnsmasq-2.93.tar.xz -o .work/dnsmasq.tar.xz
          echo '0c00d4e5c97c8306e5fb932b348b34269c9c29a0e7df0e8e82958b407092bc19  .work/dnsmasq.tar.xz' | sha256sum -c -
          tar -xf .work/dnsmasq.tar.xz -C .work
          make -C .work/dnsmasq-2.93 -j2 COPTS=-DHAVE_NFTSET
      - name: Native ucode and nftables integration
        run: bash scripts/test-native-policy.sh
  android:
    concurrency:
      group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}-android
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android helper tests and build
        working-directory: android-helper
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-helper-debug
          path: android-helper/app/build/outputs/apk/debug/*.apk
  openwrt:
    concurrency:
      group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}-openwrt
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build gawk gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget zstd
          rustup toolchain install 1.97.1 --profile minimal
      - uses: actions/cache/restore@v4
        id: sdk-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vendor/csqtt/rust-client/target
          key: cargo-musl-${{ runner.os }}-1.97.1-openwrt25.12.5-${{ hashFiles('vendor/csqtt/rust-client/Cargo.lock') }}
      - name: Native OpenWrt packages
        id: packages
        env:
          CSQTT_SIGNING_KEY: ${{ secrets.CSQTT_SIGNING_KEY }}
        run: bash scripts/build-sdk.sh
      - uses: actions/cache/save@v4
        if: always() && steps.sdk-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vendor/csqtt/rust-client/target
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12.5-aarch64-cortex-a53
          path: |
            dist/*.apk
            dist/manifest.json
            dist/manifest.sig
            dist/SHA256SUMS
