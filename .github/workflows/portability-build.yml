name: Official OpenWrt platform checks
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      package_release:
        type: string
        default: '10'
        required: false
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Stock shell parser regressions
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends busybox-static
      - name: Disposable image preparation boundaries
        run: |
          python3 tests/release/openwrt_image_test.py
          python3 tests/release/vm_disk_test.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - name: Platform and installer contracts
        run: |
          python3 tests/platforms/platforms_test.py
          python3 tests/firmware/firmware_test.py
          python3 tests/firmware/resources_test.py
          python3 tests/release/release_test.py
          python3 tests/release/draft_publication_test.py
          python3 tests/installer/installer_test.py
          python3 tests/installer/portable_test.py
          python3 tests/release/dependency_test.py
          python3 tests/release/migration_test.py
          python3 tests/release/sdk_recipe_test.py
          python3 tests/release/public_command_test.py
          python3 tests/release/vm_acceptance_test.py
          python3 tests/release/vm_timeout_test.py
          python3 scripts/assemble-installer.py --check
          node --test tests/policy/*.test.* tests/luci/*.test.*
          bash -n scripts/build-sdk.sh
          sh -n scripts/test-native-apk.sh
          sh -n scripts/measure-resources.sh
      - name: Existing broker regression checks
        working-directory: captcha-broker
        run: |
          go test -race ./...
          go vet ./...
  native-policy:
    needs: contracts
    runs-on: ubuntu-24.04
    concurrency:
      group: portability-native-policy-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Native policy dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libjson-c-dev libnftables-dev pkg-config nftables iproute2 iptables ipset conntrack
          git init .work/ucode
          git -C .work/ucode remote add origin https://github.com/jow-/ucode.git
          git -C .work/ucode fetch --depth=1 origin 85922056ef7abeace3cca3ab28bc1ac2d88e31b1
          git -C .work/ucode checkout --detach FETCH_HEAD
          cmake -S .work/ucode -B .work/ucode/build -DFS_SUPPORT=ON -DUBUS_SUPPORT=OFF -DUCI_SUPPORT=OFF -DULOOP_SUPPORT=OFF -DNL80211_SUPPORT=OFF -DRTNL_SUPPORT=OFF -DRESOLV_SUPPORT=OFF -DZLIB_SUPPORT=OFF -DDIGEST_SUPPORT=OFF -DLOG_SUPPORT=OFF
          cmake --build .work/ucode/build -j2
          curl --fail --location --retry 3 https://thekelleys.org.uk/dnsmasq/dnsmasq-2.93.tar.xz -o .work/dnsmasq.tar.xz
          echo '0c00d4e5c97c8306e5fb932b348b34269c9c29a0e7df0e8e82958b407092bc19  .work/dnsmasq.tar.xz' | sha256sum -c -
          tar -xf .work/dnsmasq.tar.xz -C .work
          make -C .work/dnsmasq-2.93 -j2 COPTS=-DHAVE_NFTSET
      - name: Existing native runtime and firewall regression
        run: bash scripts/test-native-policy.sh
  sdk:
    needs: contracts
    runs-on: ubuntu-24.04
    concurrency:
      group: portability-${{ github.ref }}-${{ matrix.profile }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        profile:
          - official-24.10.8-mediatek-filogic-aarch64_cortex-a53
          - official-24.10.8-x86-64-x86_64
          - official-25.12.5-mediatek-filogic-aarch64_cortex-a53
          - official-25.12.5-x86-64-x86_64
          - official-25.12.6-mediatek-filogic-aarch64_cortex-a53
          - official-25.12.6-x86-64-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build gawk gettext git iproute2 kmod libncurses-dev libssl-dev python3 python3-setuptools qemu-user rsync swig unzip zlib1g-dev file wget zstd
          sudo modprobe tun
          test -c /dev/net/tun
          rustup toolchain install 1.97.1 --profile minimal
      - uses: actions/cache/restore@v4
        id: portability-cargo
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .work/cargo/${{ matrix.profile }}
          key: portability-cargo-${{ runner.os }}-${{ matrix.profile }}-1.97.1-${{ hashFiles('vendor/csqtt/rust-client/Cargo.lock') }}
      - name: Candidate SDK package, static ISA and isolated TUN checks
        env:
          CSQTT_PROFILE: ${{ matrix.profile }}
          CSQTT_PACKAGE_RELEASE: ${{ inputs.package_release || '10' }}
          CSQTT_SIGNING_KEY: ${{ secrets.CSQTT_SIGNING_KEY || secrets.secret1 }}
        run: bash scripts/build-sdk.sh
      - uses: actions/cache/save@v4
        if: always() && steps.portability-cargo.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .work/cargo/${{ matrix.profile }}
          key: ${{ steps.portability-cargo.outputs.cache-primary-key }}
      - name: Compress SDK diagnostics
        if: always()
        run: |
          for log in .work/sdk/*.log; do
            [ ! -f "$log" ] || gzip -f "$log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-${{ matrix.profile }}
          path: |
            dist/${{ matrix.profile }}/**
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: candidate-diagnostics-${{ matrix.profile }}
          path: .work/sdk/*.log.gz
      # Packages may carry project signatures; all candidate manifests remain
      # unqualified. Successful native VM evidence is required before publication.
